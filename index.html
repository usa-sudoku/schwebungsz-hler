<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klavier-Schwebungsmesser (Pro)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #10b981; /* Smaragdgrün für den Pro-Modus */
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
      text-align: center;
      font-size: 1.4rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }

    label { font-size: 0.85rem; color: var(--subtext); }
    input, select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input:focus, select:focus { outline: 1px solid var(--accent); }

    .info-box {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .info-box span { font-weight: bold; color: var(--accent); font-size: 1.1rem; }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 16px 0;
    }

    .metric-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #334155;
      position: relative;
    }

    .metric-title { font-size: 0.8rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px;}
    .metric-value { font-size: 2.2rem; font-weight: bold; color: var(--accent); margin-top: 4px; }
    
    .status-indicator {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.05rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: all 0.2s ease;
    }

    button.recording { background: #ef4444; color: #fff; }

    canvas {
      width: 100%;
      height: 160px;
      background: #000;
      border-radius: 8px;
      display: block;
      margin-top: 16px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎹 Klavier-Schwebungsmesser</h1>

  <div class="grid-2">
    <div class="input-group">
      <label for="baseFreq">Grundton (Hz):</label>
      <input type="number" id="baseFreq" value="440" step="0.1">
    </div>
    <div class="input-group">
      <label for="intervalSelect">Gespieltes Intervall:</label>
      <select id="intervalSelect">
        <option value="2,1">Oktave (2:1)</option>
        <option value="3,2">Quinte (3:2)</option>
        <option value="4,3">Quarte (4:3)</option>
        <option value="5,4" selected>Große Terz (5:4)</option>
        <option value="6,5">Kleine Terz (6:5)</option>
        <option value="5,3">Große Sexte (5:3)</option>
      </select>
    </div>
  </div>

  <div class="info-box">
    Überwachter Kollisionspunkt (Oberton):<br>
    <span id="targetFreqDisplay">2200 Hz</span><br>
    <small style="color:var(--subtext)">Der Bandpassfilter isoliert exakt diese Frequenz.</small>
  </div>

  <button id="startBtn">▶ Mikrofon & Messung Starten</button>

  <div class="dashboard">
    <div class="metric-card">
      <div class="metric-title">Schwebung Frequenz</div>
      <div class="metric-value" id="beatHz">0.00 <small style="font-size:1rem">Hz</small></div>
      <div class="status-indicator" id="statusText">Warte auf Anschlag...</div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Schwebungen / Min</div>
      <div class="metric-value" id="beatBpm">0 <small style="font-size:1rem">BPM</small></div>
      <div class="status-indicator">Tempo der Welle</div>
    </div>
  </div>

  <label style="margin-top: 10px; display:block;">Isolierte Schwebungswelle (ohne Lautstärkeabfall):</label>
  <canvas id="envelopeScope"></canvas>
</div>

<script>
let audioCtx;
let stream;
let isRunning = false;
let sourceNode;
let bandpassFilter;
let processorNode;
let dummyGain;
let animId;

const startBtn = document.getElementById('startBtn');
const baseFreqInput = document.getElementById('baseFreq');
const intervalSelect = document.getElementById('intervalSelect');
const targetFreqDisplay = document.getElementById('targetFreqDisplay');
const beatHzEl = document.getElementById('beatHz');
const beatBpmEl = document.getElementById('beatBpm');
const statusText = document.getElementById('statusText');
const canvas = document.getElementById('envelopeScope');
const ctx = canvas.getContext('2d');

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

// --- AUDIO PROCESSING VARIABLEN ---
const BUFFER_SIZE = 512; 
const HISTORY_LEN = 256; // Reicht für knapp 3 Sekunden Hüllkurve
let envelopeRate = 0; // Wird basierend auf SampleRate berechnet (z.B. 48000/512 = 93.75 Hz)

// Ringpuffer für die Daten
const rawEnvHistory = new Float32Array(HISTORY_LEN);
const detrendedHistory = new Float32Array(HISTORY_LEN);
let historyPtr = 0;

// Variablen für den DC-Blocker (Filtert den Klavier-Abfall weg)
let prevRaw = 0;
let prevDetrended = 0;

function updateTargetFrequency() {
  const baseF = parseFloat(baseFreqInput.value) || 440;
  const ratios = intervalSelect.value.split(',');
  const harmonicBase = parseInt(ratios[0]);
  
  const targetF = baseF * harmonicBase;
  targetFreqDisplay.textContent = targetF.toFixed(1) + " Hz";

  if (bandpassFilter && audioCtx) {
    bandpassFilter.frequency.setValueAtTime(targetF, audioCtx.currentTime);
  }
}

baseFreqInput.addEventListener('input', updateTargetFrequency);
intervalSelect.addEventListener('change', updateTargetFrequency);
updateTargetFrequency();

startBtn.addEventListener('click', async () => {
  if (isRunning) stopAnalysis();
  else await startAnalysis();
});

async function startAnalysis() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    envelopeRate = audioCtx.sampleRate / BUFFER_SIZE; // ca. 93 Hz
    
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { 
        echoCancellation: false, 
        noiseSuppression: false, 
        autoGainControl: false // WICHTIG! AGC würde den echten Hüllkurvenverlauf verfälschen
      }
    });

    sourceNode = audioCtx.createMediaStreamSource(stream);
    
    // Akustische Lupe: Isolierter Bandpass
    bandpassFilter = audioCtx.createBiquadFilter();
    bandpassFilter.type = 'bandpass';
    bandpassFilter.Q.value = 25; // Sehr eng, um benachbarte Saiten auszublenden
    
    // Prozessor-Node für sample-genaues Verarbeiten der Hüllkurve
    processorNode = audioCtx.createScriptProcessor(BUFFER_SIZE, 1, 1);
    
    processorNode.onaudioprocess = function(e) {
      const input = e.inputBuffer.getChannelData(0);
      
      // 1. RMS (Lautstärke) des aktuellen kurzen Puffer-Abschnitts berechnen
      let sum = 0;
      for (let i = 0; i < input.length; i++) {
        sum += input[i] * input[i];
      }
      const rms = Math.sqrt(sum / input.length);
      
      // 2. DC-Blocker anwenden (Klavier-Abfall herausfiltern)
      // Formel: y[n] = x[n] - x[n-1] + R * y[n-1]
      // R = 0.98 lässt schnelle Schwebungen durch, blockiert aber langsames Abklingen
      const R = 0.98; 
      const detrended = rms - prevRaw + R * prevDetrended;
      
      prevRaw = rms;
      prevDetrended = detrended;
      
      // 3. Im Ringpuffer speichern
      rawEnvHistory[historyPtr] = rms;
      detrendedHistory[historyPtr] = detrended;
      historyPtr = (historyPtr + 1) % HISTORY_LEN;
    };

    // Stummes Ziel erstellen (damit der Prozessor im Hintergrund läuft)
    dummyGain = audioCtx.createGain();
    dummyGain.gain.value = 0;

    // Verkabelung
    sourceNode.connect(bandpassFilter);
    bandpassFilter.connect(processorNode);
    processorNode.connect(dummyGain);
    dummyGain.connect(audioCtx.destination);

    updateTargetFrequency();

    isRunning = true;
    startBtn.textContent = "⏹ Stopp";
    startBtn.classList.add('recording');

    // Visuellen Loop starten
    updateUI();
  } catch (e) {
    alert("Mikrofonfehler: " + e.message);
  }
}

function stopAnalysis() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  cancelAnimationFrame(animId);
  isRunning = false;
  startBtn.textContent = "▶ Mikrofon & Messung Starten";
  startBtn.classList.remove('recording');
}

function updateUI() {
  if (!isRunning) return;

  // Analysiere das detrended Signal (die reine Schwebung)
  analyzeBeat();
  
  // Zeichne das Oszilloskop
  drawScope();
  
  animId = requestAnimationFrame(updateUI);
}

function analyzeBeat() {
  // Überprüfe, ob überhaupt ein Ton gespielt wird (anhand der rohen Lautstärke)
  let maxRaw = 0;
  for (let i = 0; i < HISTORY_LEN; i++) {
    if (rawEnvHistory[i] > maxRaw) maxRaw = rawEnvHistory[i];
  }

  // Schwellenwert: Wenn es zu leise ist, nichts berechnen
  if (maxRaw < 0.005) {
    statusText.textContent = "Warte auf Anschlag...";
    statusText.style.color = "#64748b";
    return;
  }
  
  statusText.textContent = "Analysiere Schwebung...";
  statusText.style.color = "var(--accent)";

  // Autokorrelation auf dem gefilterten (detrended) Signal ausführen
  let maxAc = 0;
  let peakLag = -1;
  
  // Wir suchen nach Schwebungen zwischen 0.5 Hz und 40 Hz
  const minLag = Math.floor(envelopeRate / 40); // z.B. 93 / 40 = 2 Samples
  const maxLag = Math.floor(envelopeRate / 0.5); // z.B. 93 / 0.5 = 186 Samples
  
  // Kopiere den Ringpuffer in ein lineares Array für die einfache Berechnung
  const linearBuffer = new Float32Array(HISTORY_LEN);
  for(let i = 0; i < HISTORY_LEN; i++) {
    linearBuffer[i] = detrendedHistory[(historyPtr + i) % HISTORY_LEN];
  }

  // Autokorrelation (findet das sich wiederholende Muster)
  const ac = new Float32Array(maxLag);
  for (let lag = minLag; lag < maxLag && lag < HISTORY_LEN / 2; lag++) {
    let sum = 0;
    for (let i = 0; i < HISTORY_LEN - lag; i++) {
      sum += linearBuffer[i] * linearBuffer[i + lag];
    }
    ac[lag] = sum;
  }

  // Höchsten Peak finden (Periodenlänge)
  for (let lag = minLag + 1; lag < ac.length - 1; lag++) {
    if (ac[lag] > ac[lag - 1] && ac[lag] > ac[lag + 1]) {
      if (ac[lag] > maxAc) {
        maxAc = ac[lag];
        peakLag = lag;
      }
    }
  }

  // Ausgabe aktualisieren
  if (peakLag > 0) {
    const beatFreq = envelopeRate / peakLag;
    // Glätten der Anzeige (springt sonst zu stark)
    const currentHz = parseFloat(beatHzEl.textContent) || 0;
    const smoothedHz = currentHz === 0 ? beatFreq : (currentHz * 0.8 + beatFreq * 0.2);
    
    beatHzEl.textContent = smoothedHz.toFixed(2) + " Hz";
    beatBpmEl.textContent = Math.round(smoothedHz * 60) + " BPM";
  }
}

function drawScope() {
  ctx.fillStyle = "#0f172a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Mittellinie zeichnen
  ctx.lineWidth = 1;
  ctx.strokeStyle = "#334155";
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  ctx.lineWidth = 2;
  ctx.strokeStyle = "var(--accent)";
  ctx.beginPath();

  const step = canvas.width / HISTORY_LEN;
  
  // Automatische Skalierung für die Wellenhöhe
  let maxDetrended = 0.0001;
  for (let i = 0; i < HISTORY_LEN; i++) {
    const val = Math.abs(detrendedHistory[i]);
    if (val > maxDetrended) maxDetrended = val;
  }

  // Zeichne den Graphen (Rolle den Ringpuffer ab)
  for (let i = 0; i < HISTORY_LEN; i++) {
    const idx = (historyPtr + i) % HISTORY_LEN;
    const val = detrendedHistory[idx];
    
    // Normalisieren und zentrieren
    const normalized = val / maxDetrended; 
    const y = (canvas.height / 2) - (normalized * (canvas.height * 0.4));
    const x = i * step;
    
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
</script>
</body>
</html>
