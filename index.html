<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervall-Schwebungsmesser</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #a855f7; /* Violett für das neue Tool */
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      margin-top: 0;
      color: var(--accent);
      text-align: center;
      font-size: 1.4rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 16px;
    }

    label { font-size: 0.8rem; color: var(--subtext); }
    input, select {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input:focus, select:focus { outline: 1px solid var(--accent); }

    .info-box {
      background: rgba(168, 85, 247, 0.1);
      border: 1px solid var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      text-align: center;
      margin-bottom: 16px;
    }

    .info-box span { font-weight: bold; color: var(--accent); font-size: 1.1rem; }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 16px 0;
    }

    .metric-card {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 1px solid #334155;
    }

    .metric-title { font-size: 0.8rem; color: var(--subtext); text-transform: uppercase; }
    .metric-value { font-size: 2.2rem; font-weight: bold; color: var(--accent); margin-top: 4px; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: all 0.2s ease;
    }

    button.recording { background: #ef4444; color: #fff; }

    canvas {
      width: 100%;
      height: 150px;
      background: #000;
      border-radius: 8px;
      display: block;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎼 Intervall-Schwebungsmesser</h1>

  <div class="grid-2">
    <div class="input-group">
      <label for="baseFreq">Grundton (Hz):</label>
      <input type="number" id="baseFreq" value="440" step="0.1">
    </div>
    <div class="input-group">
      <label for="intervalSelect">Gespieltes Intervall:</label>
      <select id="intervalSelect">
        <option value="2,1">Oktave (2:1)</option>
        <option value="3,2">Quinte (3:2)</option>
        <option value="4,3">Quarte (4:3)</option>
        <option value="5,4" selected>Große Terz (5:4)</option>
        <option value="6,5">Kleine Terz (6:5)</option>
        <option value="5,3">Große Sexte (5:3)</option>
      </select>
    </div>
  </div>

  <div class="info-box">
    Überwachter Oberton-Kollisionspunkt:<br>
    <span id="targetFreqDisplay">2200 Hz</span>
  </div>

  <button id="startBtn">▶ Messung Starten</button>

  <div class="dashboard">
    <div class="metric-card">
      <div class="metric-title">Schwebung Frequenz</div>
      <div class="metric-value" id="beatHz">0.00 <small style="font-size:1rem">Hz</small></div>
    </div>
    <div class="metric-card">
      <div class="metric-title">Schwebungen / Min</div>
      <div class="metric-value" id="beatBpm">0 <small style="font-size:1rem">BPM</small></div>
    </div>
  </div>

  <canvas id="envelopeScope"></canvas>
</div>

<script>
let audioCtx;
let stream;
let isRunning = false;
let analyserNode;
let sourceNode;
let bandpassFilter;
let animId;

const startBtn = document.getElementById('startBtn');
const baseFreqInput = document.getElementById('baseFreq');
const intervalSelect = document.getElementById('intervalSelect');
const targetFreqDisplay = document.getElementById('targetFreqDisplay');
const beatHzEl = document.getElementById('beatHz');
const beatBpmEl = document.getElementById('beatBpm');
const canvas = document.getElementById('envelopeScope');
const ctx = canvas.getContext('2d');

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

// Wir speichern 1024 Werte. Bei der neuen, schnelleren Abtastrate reicht das für ca. 11 Sekunden Historie.
const envHistory = new Float32Array(1024);
let envPtr = 0;

// Berechnet die Ziel-Frequenz und aktualisiert den Filter
function updateTargetFrequency() {
  const baseF = parseFloat(baseFreqInput.value) || 440;
  const ratios = intervalSelect.value.split(',');
  const harmonicBase = parseInt(ratios[0]);
  
  // Der Kollisionspunkt (z.B. 440 Hz * 5 = 2200 Hz für die große Terz)
  const targetF = baseF * harmonicBase;
  targetFreqDisplay.textContent = targetF.toFixed(1) + " Hz";

  if (bandpassFilter && audioCtx) {
    bandpassFilter.frequency.setValueAtTime(targetF, audioCtx.currentTime);
  }
}

baseFreqInput.addEventListener('input', updateTargetFrequency);
intervalSelect.addEventListener('change', updateTargetFrequency);
updateTargetFrequency();

startBtn.addEventListener('click', async () => {
  if (isRunning) stopAnalysis();
  else await startAnalysis();
});

async function startAnalysis() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    sourceNode = audioCtx.createMediaStreamSource(stream);
    
    // Ein hochpräziser Bandpass-Filter ("akustische Lupe")
    bandpassFilter = audioCtx.createBiquadFilter();
    bandpassFilter.type = 'bandpass';
    bandpassFilter.Q.value = 15; // Sehr eng fokussiert
    
    analyserNode = audioCtx.createAnalyser();
    // Kleinere FFT-Größe = schnellere Updates. Wichtig für schnelle Schwebungen (Terzen schlagen schnell!)
    analyserNode.fftSize = 512; 

    sourceNode.connect(bandpassFilter);
    bandpassFilter.connect(analyserNode);

    updateTargetFrequency();

    isRunning = true;
    startBtn.textContent = "⏹ Stopp";
    startBtn.classList.add('recording');

    processAudio();
  } catch (e) {
    alert("Mikrofonfehler: " + e.message);
  }
}

function stopAnalysis() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (audioCtx) audioCtx.close();
  cancelAnimationFrame(animId);
  isRunning = false;
  startBtn.textContent = "▶ Messung Starten";
  startBtn.classList.remove('recording');
}

function processAudio() {
  if (!isRunning) return;

  const bufferLength = analyserNode.fftSize;
  const timeData = new Float32Array(bufferLength);
  analyserNode.getFloatTimeDomainData(timeData);

  let sum = 0;
  for (let i = 0; i < timeData.length; i++) sum += timeData[i] * timeData[i];
  const rms = Math.sqrt(sum / timeData.length);

  envHistory[envPtr] = rms;
  envPtr = (envPtr + 1) % envHistory.length;

  // FrameRate = 48000 / 512 = ~93.75 Hz
  const frameRate = audioCtx.sampleRate / bufferLength;
  const beatFreq = calculateBeatFrequency(envHistory, frameRate);

  // Terzen können in gleichstufiger Stimmung bis zu 25 Hz Schwebung haben, wir erlauben bis 40 Hz
  if (beatFreq > 0.3 && beatFreq < 40) {
    beatHzEl.textContent = beatFreq.toFixed(2) + " Hz";
    beatBpmEl.textContent = Math.round(beatFreq * 60) + " BPM";
  } else {
    beatHzEl.textContent = "0.00 Hz";
    beatBpmEl.textContent = "0 BPM";
  }

  drawScope(envHistory, envPtr);
  animId = requestAnimationFrame(processAudio);
}

function calculateBeatFrequency(history, frameRate) {
  const n = history.length;
  let mean = 0;
  for (let i = 0; i < n; i++) mean += history[i];
  mean /= n;

  const ac = new Float32Array(Math.floor(n / 2));
  for (let lag = 0; lag < ac.length; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) {
      sum += (history[i] - mean) * (history[i + lag] - mean);
    }
    ac[lag] = sum;
  }

  let peakLag = -1;
  let maxVal = 0;
  for (let lag = 2; lag < ac.length - 1; lag++) {
    if (ac[lag] > ac[lag - 1] && ac[lag] > ac[lag + 1]) {
      if (ac[lag] > maxVal) {
        maxVal = ac[lag];
        peakLag = lag;
      }
    }
  }

  if (peakLag > 0) return frameRate / peakLag;
  return 0;
}

function drawScope(history, currentPtr) {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.lineWidth = 2;
  ctx.strokeStyle = "#a855f7";
  ctx.beginPath();

  const step = canvas.width / history.length;
  let maxAmp = 0.0001;
  for (let i = 0; i < history.length; i++) if (history[i] > maxAmp) maxAmp = history[i];

  for (let i = 0; i < history.length; i++) {
    const idx = (currentPtr + i) % history.length;
    const normalized = history[idx] / maxAmp;
    const y = canvas.height - (normalized * (canvas.height * 0.8) + 10);
    const x = i * step;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
}
</script>
</body>
</html>
